name: Android Unit Tests (Phase 2D)

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:
    inputs:
      run_full_suite:
        description: "Run all unit tests instead of only the Phase 2D targeted suite"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  unit-tests:
    name: Targeted Debug Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21 (required for Gradle 9.3.1 & AGP 9.1.1)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Accept Android SDK licenses and install required packages
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-36.1"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Ensure Gradle Wrapper exists
        run: |
          if [ ! -f ./gradlew ] || [ ! -f ./gradle/wrapper/gradle-wrapper.jar ]; then
            gradle wrapper --gradle-version 9.3.1 --no-daemon
          fi
          chmod +x ./gradlew
          ./gradlew --version --no-daemon

      - name: Ensure debug keystore exists for debugConfig
        run: |
          if [ ! -f ./debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Run accumulated Phase 2D targeted unit tests
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_full_suite != true }}
        run: |
          ./gradlew :app:testDebugUnitTest \
            --tests "com.example.TrackMatcherTest" \
            --tests "com.example.CatalogProviderAbstractionTest" \
            --tests "com.example.MusicBrainzIsrcEnrichmentTest" \
            --tests "com.example.DownloadSourceResolverTest" \
            --tests "com.example.CachingDownloadSourceResolverTest" \
            --tests "com.example.OpenSubsonicResolverIntegrationTest" \
            --stacktrace

      - name: Run full unit test suite (manual dispatch option)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_full_suite == true }}
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Summarize JUnit test results
        if: always()
        run: |
          python3 - <<'EOF'
          import glob, os, xml.etree.ElementTree as ET

          files = sorted(glob.glob("app/build/test-results/testDebugUnitTest/TEST-*.xml"))
          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          lines = ["## Android Debug Unit Test Summary", ""]
          if not files:
              lines.append("No JUnit XML test result files were generated (check build/compilation logs).")
          else:
              total_tests = total_fail = total_err = total_skip = 0
              lines.append("| Test Suite | Tests | Failures | Errors | Skipped | Time (s) |")
              lines.append("|---|---:|---:|---:|---:|---:|")
              for f in files:
                  root = ET.parse(f).getroot()
                  name = root.attrib.get("name", os.path.basename(f))
                  t = int(root.attrib.get("tests", 0))
                  fl = int(root.attrib.get("failures", 0))
                  er = int(root.attrib.get("errors", 0))
                  sk = int(root.attrib.get("skipped", 0))
                  tm = root.attrib.get("time", "0")
                  total_tests += t
                  total_fail += fl
                  total_err += er
                  total_skip += sk
                  lines.append(f"| `{name}` | {t} | {fl} | {er} | {sk} | {tm} |")
              lines.append(f"| **Total** | **{total_tests}** | **{total_fail}** | **{total_err}** | **{total_skip}** | |")
          text = "\n".join(lines) + "\n"
          print(text)
          if summary_path:
              with open(summary_path, "a", encoding="utf-8") as fh:
                  fh.write(text)
          EOF

      - name: Upload unit test reports and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-unit-test-reports
          path: |
            app/build/test-results/testDebugUnitTest/
            app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 14
